[package]
name = "pd-vm-compat-frontends"
version = "0.1.0"
edition = "2024"
description = "TypeScript and Lua compatibility frontends for pd-vm"
license = "MIT"
repository = "https://github.com/rustscript-lang/rustscript-compat-frontends"
homepage = "https://rustscript.org/"

[lib]
name = "pd_vm_compat_frontends"

[[bin]]
name = "pd-vm-compat-run"
path = "src/bin/pd-vm-compat-run.rs"

[dependencies]
pd-host-function = { git = "https://github.com/rustscript-lang/rustscript", rev = "47cac633cde1f9cb67607141e0a6cfe9103ca4a4", package = "pd-host-function" }
pd-vm = { git = "https://github.com/rustscript-lang/rustscript", rev = "47cac633cde1f9cb67607141e0a6cfe9103ca4a4" }
swc_common = "26.0.0"
swc_ecma_ast = "29.0.2"
swc_ecma_parser = { version = "46.0.0", default-features = false, features = ["typescript", "stacker"] }

[dev-dependencies]
serde_json = "1"
