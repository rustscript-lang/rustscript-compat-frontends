name: Publish compat crate

on:
  workflow_dispatch:
    inputs:
      compat_version:
        description: Exact pd-vm-compat-frontends version already present in Cargo.toml
        required: true
        type: string
      pd_vm_version:
        description: Published pd-vm registry release supporting the typed frontend API; no default is selected
        required: true
        type: string

concurrency:
  group: publish-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout compatibility frontends
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test release preflight guards and rollback
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Prepare the compat-only registry candidate
        env:
          COMPAT_VERSION: ${{ inputs.compat_version }}
          PD_VM_VERSION: ${{ inputs.pd_vm_version }}
        run: >-
          python3 scripts/prepare-release.py
          --compat-version "$COMPAT_VERSION"
          --pd-vm-version "$PD_VM_VERSION"
      - name: Verify package against the selected registry dependency
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
      - name: Test prepared registry provenance and behavior
        env:
          PD_VM_EXPECTED_REGISTRY_VERSION: ${{ inputs.pd_vm_version }}
        run: cargo test --locked --workspace -- --test-threads=1
      - name: Package dry run
        run: cargo publish --locked --dry-run --allow-dirty
      - name: Publish compatibility crate only
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is required" >&2
            exit 1
          fi
          cargo publish --locked --allow-dirty --token "$CARGO_REGISTRY_TOKEN"
